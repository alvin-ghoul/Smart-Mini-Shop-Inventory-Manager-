
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Smart Mini-Shop Inventory Manager</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <!-- Header -->
        <header>
            <h1> Smart Mini-Shop Inventory</h1>

            <div class="stats">

                <p>
                    Total Products:
                    <span id="product-count">0</span>
                </p>

                <p>
                    Low Stock Alerts:
                    <span id="low-stock-count">0</span>
                </p>

            </div>
        </header>

        <!-- Inventory Form -->
        <div class="form-container">

            <h2> Add New Product</h2>

            <form id="inventory-form">

                <label for="product-name">Product Name</label>

                <input
                    type="text"
                    id="product-name"
                    placeholder="e.g. Milk, Sugar, Notebooks"
                    required
                >

                <label for="product-qty">Quantity in Stock</label>

                <input
                    type="number"
                    id="product-qty"
                    placeholder="Enter quantity"
                    min="0"
                    required
                >

                <label for="product-price">Unit Price</label>

                <input
                    type="number"
                    id="product-price"
                    placeholder="Enter unit price"
                    min="0"
                    step="0.01"
                    required
                >

                <label for="product-category">Product Category</label>

                <select id="product-category" required>

                    <option value="Groceries">Groceries</option>
                    <option value="Drinks">Drinks</option>
                    <option value="Stationery">Stationery</option>
                    <option value="Household">Household</option>

                </select>

                <button type="submit">
                    Add to Inventory
                </button>

            </form>

        </div>

        <!-- Inventory Display -->
        <div class="inventory-container">

            <h2> My Inventory</h2>

            <div id="inventory-list"></div>

        </div>

    </div>

    <!-- External JavaScript -->
    <script src="script.js"></script>

</body>
</html>
